<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet Vault — a job in three rooms</title>
<meta name="description" content="Velvet Vault: a top-down stealth heist. Read the guard cones and the camera sweeps, break the line of sight with cover and smoke, lift the loot and reach the exit before the alarm meter fills.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1524'/%3E%3Cpath d='M16 6l9 10-9 10-9-10z' fill='%23ffd35c'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #8595b5;
          font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.08em; }
  /* Read aloud, never shown: the line a screen reader announces as the game changes screen. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Velvet Vault: move the thief with WASD or the arrow keys, hold Shift to sneak, aim with the mouse and click to use the selected tool, lift every piece of loot and reach the exit before the alarm meter fills."></canvas>
<p id="boot">VELVET VAULT</p>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
